name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  cli:
    name: CLI (cargo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
      - name: Release build
        run: cargo build -p openw8s --release
      - name: Validate seed manifests
        run: |
          for f in examples/*.openw8s.yml; do
            ./target/release/openw8s validate -m "$f"
          done

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Sync catalog from examples
        working-directory: .
        run: bash scripts/sync-catalog.sh
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  dogfood:
    name: Dogfood (HF inspect)
    runs-on: ubuntu-latest
    needs: [cli]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build CLI
        run: cargo build -p openw8s --release
      - name: Dogfood
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: bash scripts/dogfood.sh
