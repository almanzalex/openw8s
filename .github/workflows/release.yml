name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: openw8s-x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
            archive: openw8s-aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
            archive: openw8s-x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build -p openw8s --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/openw8s"
          STAGE="${{ matrix.archive }}"
          mkdir -p "$STAGE"
          cp "$BIN" "$STAGE/openw8s"
          cp README.md LICENSE "$STAGE/"
          tar -czf "${STAGE}.tar.gz" "$STAGE"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/**/*.tar.gz
